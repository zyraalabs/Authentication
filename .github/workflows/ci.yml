name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Type check, lint, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm exec biome ci src/

      - name: Build
        run: pnpm build
        env:
          NEXTAUTH_SECRET: ci-placeholder
          NEXTAUTH_URL: http://localhost:3001
          NEXTAUTH_COOKIE_DOMAIN: .example.com
          MONGODB_URI: mongodb://localhost:27017/ci
          JWT_SECRET: ci-placeholder
          UPSTASH_REDIS_REST_URL: https://placeholder.upstash.io
          UPSTASH_REDIS_REST_TOKEN: ci-placeholder
          RESEND_API_KEY: re_ci_placeholder
          RESEND_FROM_EMAIL: noreply@example.com
          ZYRAA_APP_URL: http://localhost:3002
          NEXT_PUBLIC_HOME_URL: http://localhost:3000
          ARCJET_KEY: ajkey_ci_placeholder
          GOOGLE_CLIENT_ID: ci-placeholder
          GOOGLE_CLIENT_SECRET: ci-placeholder
          GITHUB_CLIENT_ID: ci-placeholder
          GITHUB_CLIENT_SECRET: ci-placeholder
